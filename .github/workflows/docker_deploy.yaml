name: Build and Publish PHP Application to Docker Hub

on:
  push:
    branches:
      - master
      - dev

  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

concurrency:
  group: dockerhub-production
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/php-devops-app
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ==========================================================
  # 1. PHP UNIT TESTS
  # ==========================================================

  test:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer update \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Run PHPUnit
        run: |
          vendor/bin/phpunit

  # ==========================================================
  # 2. BUILD AND PUSH TO DOCKER HUB
  # ==========================================================

  build-and-push:
    name: Build and Push Docker Image
    needs: test

    if: |
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/main'
      )

    runs-on: ubuntu-latest

    outputs:
      image-uri: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            .

      - name: Push image to Docker Hub
        run: |
          docker push ${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_IMAGE }}:latest

      - name: Output image URI
        id: image
        run: |
          echo "image=${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          echo "Docker image published successfully."
          echo "Image: ${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "Commit: ${{ github.sha }}"